name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly scan every Monday at 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  # Audit both locked trees. One high/critical finding fails its job.
  npm-audit:
    name: npm audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [., docs]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit

      - name: Run npm audit
        run: npm audit --audit-level=high

  # CodeQL static analysis (JavaScript/TypeScript)
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  # Dependency review (PR-only): blocks high-severity additions + denied licenses
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          # jszip is dual-licensed "GPL-3.0-only OR MIT" — we use it under MIT,
          # but the GPL half trips the deny-list. Exempt the package explicitly.
          allow-dependencies-licenses: pkg:npm/jszip

  # Secret scanning: catch committed API keys, tokens, PATs
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lint both service Dockerfiles.
  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, docs/Dockerfile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: 'false'
          # Hadolint uses error/warning/info/style, not CVSS severities.
          failure-threshold: warning

      - name: Upload Hadolint SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('hadolint-results.sarif') != ''
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint-${{ matrix.dockerfile }}

  # Grype: filesystem vulnerability scan (Trivy fs equivalent, uncompromised maintainer)
  grype:
    name: Grype Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype
        with:
          path: .
          severity-cutoff: high
          fail-build: 'true'
          only-fixed: 'false'
          output-format: sarif
          output-file: grype-results.sarif

      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('grype-results.sarif') != ''
        with:
          sarif_file: grype-results.sarif
          category: grype

  # Scan OS packages, Node and dependencies in builders as well as shipped images.
  container-scan:
    name: Container scan (${{ matrix.service }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [app, docs]
        target: [build, runtime]
        include:
          - service: app
            context: .
            dockerfile: Dockerfile
          - service: docs
            context: docs
            dockerfile: docs/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image to scan
        run: >-
          docker build --pull
          --target "${{ matrix.target }}"
          --tag "gridfinity-${{ matrix.service }}-${{ matrix.target }}:scan"
          --file "${{ matrix.dockerfile }}"
          "${{ matrix.context }}"

      - name: Scan image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: gridfinity-${{ matrix.service }}-${{ matrix.target }}:scan
          severity-cutoff: high
          fail-build: 'true'
          only-fixed: 'false'
          output-format: sarif
          output-file: grype-image.sarif

      - name: Upload image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('grype-image.sarif') != ''
        with:
          sarif_file: grype-image.sarif
          category: grype-image-${{ matrix.service }}-${{ matrix.target }}
